name: Lead Scrape (manual)

# No schedule on purpose. Searching happens on demand in the web UI, so the
# repo never pays to re-scrape businesses it already has. This workflow is
# kept as a manual fallback: run it from the Actions tab when you want a
# scrape without your laptop on.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no real calls or emails)"
        type: boolean
        default: true

permissions:
  contents: write   # needed so the workflow can commit new leads back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Secrets can't be referenced from a step's `if:`, so they're lifted to
    # job-level env here — which step conditions *can* read.
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      OUTREACH_CONFIG_JSON: ${{ secrets.OUTREACH_CONFIG_JSON }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure config.json exists
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
          fi

      - name: Run scraper
        run: python scraper.py

      - name: Prioritize leads
        run: python prioritize_leads.py

      # Skipped unless OUTREACH_CONFIG_JSON is set, so the repo can never dial
      # out with the placeholder values from outreach_config.example.json.
      - name: Run outreach (calls + emails)
        if: env.OUTREACH_CONFIG_JSON != '' && env.RETELL_API_KEY != ''
        run: |
          printf '%s' "$OUTREACH_CONFIG_JSON" > outreach_config.json
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python outreach.py --dry-run
          else
            python outreach.py
          fi

      - name: Commit new leads back to repo
        run: |
          rm -f outreach_config.json
          git config user.name "lead-scraper-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Add new leads + outreach results - $(date -u +'%Y-%m-%d')"
          git push
